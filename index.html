<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="icon" type="image/png" href="img/favicon.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: app shell — top bar, one working view, bottom tab bar on phones / left rail on desktop; door-plate tiles for flats */
:root{
  --bg:#eef2f1; --surface:#ffffff; --surface-2:#f6f8f8; --ink:#16232b; --muted:#5d6d74; --line:#d9e1e0;
  --accent:#1f6f78; --accent-ink:#ffffff; --accent-soft:#dcecee;
  --good:#2b7a4b; --good-bg:#dff1e6; --warn:#9a6212; --warn-bg:#fbeed4; --bad:#b8352a; --bad-bg:#fbe3e0;
  --plate:#24343c; --plate-ink:#f2f5f4; --shadow:0 1px 2px rgba(22,35,43,.06),0 4px 14px rgba(22,35,43,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1618; --surface:#162125; --surface-2:#1b282c; --ink:#e4ecec; --muted:#95a6aa; --line:#27383c;
  --accent:#57b8c2; --accent-ink:#062629; --accent-soft:#1d3a3e;
  --good:#6cc794; --good-bg:#17332a; --warn:#e2ab52; --warn-bg:#3a2e17; --bad:#f08276; --bad-bg:#3d1f1c;
  --plate:#2c3f46; --plate-ink:#eef3f2; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1618; --surface:#162125; --surface-2:#1b282c; --ink:#e4ecec; --muted:#95a6aa; --line:#27383c;
  --accent:#57b8c2; --accent-ink:#062629; --accent-soft:#1d3a3e;
  --good:#6cc794; --good-bg:#17332a; --warn:#e2ab52; --warn-bg:#3a2e17; --bad:#f08276; --bad-bg:#3d1f1c;
  --plate:#2c3f46; --plate-ink:#eef3f2; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
.shell{display:grid;grid-template-columns:minmax(0,1fr);align-content:start;min-height:100%}
.shell>*{min-width:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-family:var(--f-display);font-size:18px;line-height:1.1}
.brand span{font-size:12px;color:var(--muted)}
.yearsel{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600}
main{padding:16px 16px 110px;max-width:1100px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:none;padding:6px 4px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="true"]{color:var(--accent);font-weight:600}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:14px 20px;font-weight:600;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;cursor:pointer}
@media (min-width:900px){
  .shell{grid-template-columns:220px 1fr}
  .tabs{position:sticky;top:0;height:100vh;grid-template-columns:1fr;align-content:start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:84px 12px 12px;grid-row:1/span 2;background:var(--surface)}
  .tab{flex-direction:row;justify-content:flex-start;gap:10px;font-size:15px;padding:10px 12px}
  .tab[aria-current="true"]{background:var(--accent-soft)}
  .topbar{grid-column:2}
  main{grid-column:2;padding-bottom:40px}
  .fab{bottom:24px;right:24px}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-h h2{font-size:18px}
.sub{color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:clamp(20px,5vw,28px);font-weight:700;line-height:1.15}
.kpi .f{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.good .v{color:var(--good)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.grid2>*{min-width:0}
@media (min-width:900px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.click{cursor:pointer}
.row.click:hover .t{color:var(--accent)}
.amt{font-weight:600;white-space:nowrap}
.amt.bad{color:var(--bad)} .amt.good{color:var(--good)}
.plate{display:inline-flex;align-items:center;justify-content:center;gap:4px;background:var(--plate);color:var(--plate-ink);border-radius:6px;padding:4px 8px;font-family:var(--f-display);font-weight:700;font-size:13px;white-space:nowrap;letter-spacing:.02em}
.plate i{font-style:normal;opacity:.55;font-weight:500}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:150px;padding-top:18px}
.bar{position:relative;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bar.future{background:var(--line)}
.bar b{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--ink)}
.barlbl{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
.meter{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.meter span{display:block;height:100%;background:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv.strong{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.blockhead{display:flex;align-items:baseline;gap:10px;margin:6px 0 8px}
.blockhead h3{font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;min-width:0;border-left:4px solid var(--good)}
.tile.warn{border-left-color:var(--warn)} .tile.bad{border-left-color:var(--bad)}
.tile:hover{box-shadow:var(--shadow)}
.tile .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.tile .db{font-weight:600;font-size:14px}
.dots{display:grid;grid-template-columns:repeat(12,1fr);gap:2px}
.dots span{height:6px;border-radius:2px;background:var(--line)}
.dots .p{background:var(--good)} .dots .k{background:var(--warn)} .dots .l{background:var(--bad)}
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (min-width:640px){.months{grid-template-columns:repeat(12,minmax(0,1fr))}}
.mcell{border-radius:8px;padding:8px 4px;text-align:center;font-size:12px;border:1px solid var(--line);background:var(--surface-2)}
.mcell b{display:block;font-size:12px}
.mcell.p{background:var(--good-bg);border-color:transparent;color:var(--good)}
.mcell.k{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.mcell.l{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
a.btn{text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:0;cursor:pointer}
.unithead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.unithead .plate{font-size:22px;padding:10px 14px;border-radius:8px}
.unithead .who{flex:1;min-width:0;flex-basis:180px}
.unithead .who h1{font-size:22px}
.big{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.1}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.stat3 div{background:var(--surface-2);border-radius:10px;padding:10px;min-width:0}
.stat3 small{display:block;color:var(--muted);font-size:12px}
.stat3 b{font-size:15px}
.tx .rm{visibility:hidden}
.tx:hover .rm,.tx:focus-within .rm{visibility:visible}
@media (hover:none){.tx .rm{visibility:visible}}
.iconbtn{border:0;background:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;font-size:13px}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn.confirm{color:var(--bad);font-weight:600}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,20,24,.45);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet{border-radius:16px}}
.sheet h2{font-size:20px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:8px 4px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.t-borc button[aria-pressed="true"]{color:var(--bad)} .seg.t-indirim button[aria-pressed="true"]{color:var(--good)}
.hint{font-size:12px;color:var(--muted)}
.err{font-size:13px;color:var(--bad);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.notice{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px;font-size:13px}
.catbar{display:grid;grid-template-columns:minmax(0,1fr) 110px;min-width:0;gap:10px;align-items:center;padding:6px 0}
.catbar .meter{height:8px}
.scroll-x{overflow-x:auto}
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:700px){.steps{grid-template-columns:repeat(4,minmax(0,1fr))}}
.step{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.step .cnt{font-weight:600;font-size:13px} .step .cnt.warn{color:var(--warn)} .step .cnt.bad{color:var(--bad)}
.wrapinfo .s{white-space:normal}
.wrapinfo .t{white-space:normal}
.wrapinfo .grow{flex:1 1 200px}
.banner{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn);border-radius:var(--r);padding:12px 16px;font-weight:600}


/* ---- süsleme ---- */
:root{ --sky-block:#c6d5d6; --sky-win:#eef4f4; --hero1:#1b3540; --hero2:#1f6f78; }
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){ --sky-block:#2a3e44; --sky-win:#3c565d; --hero1:#12262d; --hero2:#1c5a61; }}
:root[data-theme="dark"]{ --sky-block:#2a3e44; --sky-win:#3c565d; --hero1:#12262d; --hero2:#1c5a61; }
.skyline{display:block;width:100%;height:auto}
.hero{position:relative;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border-radius:18px;padding:20px 20px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px;overflow:hidden;box-shadow:0 8px 24px rgba(20,50,60,.18)}
.hero h1{color:#fff;font-size:clamp(22px,5.5vw,30px)}
.hero p{margin:0;color:rgba(255,255,255,.78);font-size:14px}
.hero .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:rgba(255,255,255,.8);margin-top:2px}
.hero .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (min-width:760px){.hero{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);align-items:end}.hero .skyline{max-width:520px;justify-self:end}}
.kpi{border-top:3px solid var(--accent);box-shadow:0 1px 2px rgba(22,35,43,.05),0 6px 18px rgba(22,35,43,.05)}
.kpi.bad{border-top-color:var(--bad)} .kpi.good{border-top-color:var(--good)}
.card{box-shadow:0 1px 2px rgba(22,35,43,.04),0 4px 14px rgba(22,35,43,.04)}
.sec-h h2::before{content:"";display:inline-block;width:6px;height:16px;border-radius:3px;background:var(--accent);margin-right:8px;vertical-align:-2px}
.tab{position:relative}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:1px 6px;line-height:1.4}
@media (min-width:900px){.badge{left:auto;right:12px;top:50%;transform:translateY(-50%)}}
.tabs{grid-template-columns:repeat(6,1fr)!important}
@media (min-width:900px){.tabs{grid-template-columns:1fr!important}}
.tab{font-size:11px}
@media (min-width:900px){.tab{font-size:15px}}
.brandmark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--hero1),var(--hero2));display:grid;place-items:center;flex:none}
.brandmark svg{width:20px;height:20px}
.btable{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.btable th,.btable td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.btable th{font-size:12px;color:var(--muted);font-weight:600}
.btable tr.dup{opacity:.6}
.btable select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:4px 6px}
.poll{padding:12px 0;border-bottom:1px solid var(--line)} .poll:last-child{border-bottom:0}
.rbanner{background:linear-gradient(135deg,var(--hero1),var(--hero2))!important;box-shadow:0 8px 24px rgba(20,50,60,.18);overflow:hidden}
.rbanner .skyline{margin-top:10px;max-width:520px}
.unitswitch{display:flex;gap:8px;flex-wrap:wrap}
.unitswitch button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center}
.unitswitch button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
body.loginbg{background:radial-gradient(1200px 600px at 50% -10%,var(--accent-soft),var(--bg))}
.ractions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:640px){.ractions{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ractions .btn{flex-direction:column;gap:4px;padding:12px 8px;font-size:13px}
.ractions .btn svg{width:22px;height:22px;color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.card,.kpi{transition:transform .15s} .tile:hover{transform:translateY(-1px)}}


/* ---- site fotoğrafı ---- */
body.loginbg{background:#10242b}
body.loginbg::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(12,28,34,.35) 0%,rgba(12,28,34,.55) 45%,rgba(12,28,34,.9) 100%),url(img/site-giris.jpg) center 30%/cover no-repeat}
body.loginbg .login{background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-color:rgba(255,255,255,.4);box-shadow:0 20px 50px rgba(0,0,0,.35)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body.loginbg .login{background:rgba(22,33,37,.88);border-color:rgba(255,255,255,.08)}}
:root[data-theme="dark"] body.loginbg .login{background:rgba(22,33,37,.88);border-color:rgba(255,255,255,.08)}
body.loginbg .login .rbanner{background:transparent!important;box-shadow:none;padding:6px 2px 0;color:var(--ink)}
body.loginbg .login .rbanner h1{color:var(--ink);font-size:clamp(26px,7vw,32px)}
body.loginbg .login .rbanner p{color:var(--muted)}
.hero,.rbanner{background:linear-gradient(100deg,rgba(16,36,43,.94) 0%,rgba(16,36,43,.78) 45%,rgba(16,36,43,.45) 100%),url(img/site-baslik.jpg) center 55%/cover no-repeat!important}
.hero .skyline,.rbanner .skyline{opacity:.95;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.photo-credit{font-size:11px;color:rgba(255,255,255,.6);margin-top:4px}

/* ---- sakin görünümü ---- */
@media (min-width:700px){.kpis.kpis3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpis.kpis3 .kpi:last-child:nth-child(odd){grid-column:1/-1}
@media (min-width:700px){.kpis.kpis3 .kpi:last-child:nth-child(odd){grid-column:auto}}
.login{max-width:440px;width:100%;margin:6vh auto 0;display:flex;flex-direction:column;gap:16px}
.topbar .btn.small{flex:none}
body.resident .tabs, body.resident .topbar, body.resident .fab{display:none!important}
body.resident .shell{grid-template-columns:minmax(0,1fr)}
body.resident main{grid-column:1;max-width:860px;padding-bottom:48px}
.rbanner{background:#1f3a45;color:#fff;border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:4px}
.rbanner h1{font-size:clamp(24px,6vw,34px);color:#fff}
.rbanner p{margin:0;color:#b9cdd3;font-size:14px}
.rbanner .btn{color:var(--ink)}
.rplate{display:inline-flex;align-items:center;gap:6px;background:var(--plate);color:var(--plate-ink);border-radius:8px;padding:8px 12px;font-family:var(--f-display);font-weight:700;font-size:20px;white-space:nowrap}
.rplate i{font-style:normal;opacity:.55;font-weight:500}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:7px 0}
.cat .cbar{grid-column:1/-1;height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.cat .cbar span{display:block;height:100%;background:var(--accent)}
.iban{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:12px}
.iban code{font-family:ui-monospace,Menlo,monospace;font-size:15px;letter-spacing:.03em;word-break:break-all;flex:1;min-width:0}
.ann{padding:10px 0;border-bottom:1px solid var(--line)} .ann:last-child{border-bottom:0}
.ann p{margin:4px 0 0;white-space:pre-line}
.rnote{border-radius:12px;padding:14px 16px;background:var(--accent-soft)}
.rnote.err{background:var(--bad-bg);color:var(--bad);font-weight:600}
#ekstre-render{position:fixed;left:-10000px;top:0;width:794px;background:#fff;color:#16232b;font-family:"IBM Plex Sans",Arial,sans-serif}
@media (prefers-reduced-motion:no-preference){.tile,.btn,.chip{transition:box-shadow .15s,background .15s}}
.pwacard{display:flex;gap:14px;align-items:flex-start}
.pwacard b{font-size:15px}
.credit{display:flex;flex-direction:column;align-items:center;gap:4px;margin:22px auto 8px;opacity:.75}
.credit img{width:74px;height:auto}
.credit span{font-size:9px;letter-spacing:.32em;color:#fff;text-transform:uppercase}
body:not(.loginbg) .credit{display:none}
.cmptbl{width:100%;border-collapse:collapse;font-size:14px}
@media (max-width:480px){.cmptbl{font-size:12.5px}}
.cmptbl th,.cmptbl td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.cmptbl .num{text-align:right;white-space:nowrap}
.cmptbl th{font-size:12px;color:var(--muted);font-weight:600}
.cmpleg{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.cmpleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cmpbars{display:flex;flex-direction:column;gap:12px}
.cmprow{display:flex;flex-direction:column;gap:4px}
.cmplbl{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.cmpbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.cmpbar b{display:block;height:8px;border-radius:4px;min-width:2px}
/* --- yeni özet ekranı --- */
.ozgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:900px){.ozgrid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
.hero.slim{padding:16px 18px 10px}
.gauge{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 18px;align-items:center;padding:18px}
.ring{position:relative;width:118px;height:118px}
.ring svg{width:100%;height:100%}
.ring .trk{fill:none;stroke:var(--surface-2);stroke-width:12}
.ring .val{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring .val.good{stroke:var(--good)} .ring .val.warn{stroke:var(--warn)} .ring .val.bad{stroke:var(--bad)}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtxt b{font-family:var(--f-display);font-size:28px;line-height:1}
.ringtxt span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.glbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.gbig{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,6.5vw,36px);line-height:1.1;margin:2px 0 4px}
.gmain .sub{font-size:12.5px}
.gstats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);padding-top:14px}
.gst{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.gst:hover{background:var(--accent-soft)} .gst:focus-visible{outline:2px solid var(--accent)}
.gst .l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gst b{font-family:var(--f-display);font-size:clamp(15px,4vw,19px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gst b small{font-size:12px;color:var(--muted);font-weight:500}
.gst .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gst .bad{color:var(--bad)} .gst .good{color:var(--good)}
.todo .list{gap:6px}
.todo-row{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;background:var(--surface-2);width:100%}
.todo-row:hover{background:var(--accent-soft)} .todo-row:focus-visible{outline:2px solid var(--accent)}
.todo-row .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.todo-row .t{font-weight:600;font-size:14px}
.todo-row .s{font-size:12px;color:var(--muted)}
.todo-row .chev{width:18px;height:18px;color:var(--muted);flex:none}
.ib{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.ib svg{width:19px;height:19px}
.ib.accent{background:var(--accent-soft);color:var(--accent)} .ib.warn{background:var(--warn-bg);color:var(--warn)}
.ib.bad{background:var(--bad-bg);color:var(--bad)} .ib.good{background:var(--good-bg);color:var(--good)}
.allok{display:flex;gap:12px;align-items:center;padding:6px 0}
.row.debt{border-left:4px solid var(--warn);padding-left:10px;margin-left:-2px}
.row.debt.bad{border-left-color:var(--bad)}
.row.debt .s{font-size:12px}
.ozseg{display:flex;gap:4px;background:var(--surface-2);border-radius:10px;padding:4px;margin-bottom:12px}
.ozseg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:7px 0;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted)}
.ozseg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.ozseg button:focus-visible{outline:2px solid var(--accent)}
.meter.good span{background:var(--good)} .meter.warn span{background:var(--warn)} .meter.bad span{background:var(--bad)}
.fab svg{transition:transform .2s} .fab.open svg{transform:rotate(45deg)}
.fabmenu{position:fixed;right:16px;bottom:calc(136px + env(safe-area-inset-bottom,0px));z-index:31;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
@media (min-width:900px){.fabmenu{bottom:84px;right:24px}}
.fabmenu button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px}
.fabmenu span{background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;padding:7px 12px;border-radius:8px;box-shadow:var(--shadow)}
.fabmenu i{width:46px;height:46px;border-radius:50%;background:var(--surface);color:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.fabmenu i svg{width:21px;height:21px}
.fabmenu button:hover i{background:var(--accent);color:var(--accent-ink)}
.fabmenu button:focus-visible span{outline:2px solid var(--accent)}
@media (min-width:900px){.ozgrid .gauge{order:-1}}
@media (max-width:520px){
  .gauge{grid-template-columns:auto minmax(0,1fr);gap:12px 14px;padding:16px}
  .ring{width:96px;height:96px} .ringtxt b{font-size:23px}
  .gstats{grid-template-columns:minmax(0,1fr);gap:6px}
  .gst{flex-direction:row;align-items:baseline;flex-wrap:wrap;column-gap:8px}
  .gst .l{flex:1 1 auto} .gst b{order:3;margin-left:auto} .gst .s{order:2;flex-basis:100%;order:4}
}
/* giriş: geniş ekranlarda fotoğraf büyütülmeden, tam yükseklikte ve net gösterilir; kenarlar bulanık zeminle tamamlanır */
@media (min-aspect-ratio: 5/4){
  body.loginbg::before{background:linear-gradient(180deg,rgba(12,28,34,.35),rgba(12,28,34,.55)),url(img/site-giris-bulanik.jpg) center/cover no-repeat}
  body.loginbg::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:linear-gradient(180deg,rgba(12,28,34,.5) 0%,rgba(12,28,34,.2) 35%,rgba(12,28,34,.1) 70%,rgba(12,28,34,.45) 100%),url(img/site-giris-genis.jpg) center bottom/auto 100% no-repeat;
    -webkit-mask-image:linear-gradient(90deg,transparent calc(50% - 75vh),#000 calc(50% - 60vh),#000 calc(50% + 60vh),transparent calc(50% + 75vh));
            mask-image:linear-gradient(90deg,transparent calc(50% - 75vh),#000 calc(50% - 60vh),#000 calc(50% + 60vh),transparent calc(50% + 75vh))}
}
body.loginbg .pwaslot{max-width:420px;margin:14px auto 0}
body.loginbg .pwaslot .pwacard{background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 12px 30px rgba(0,0,0,.3)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body.loginbg .pwaslot .pwacard{background:rgba(22,33,37,.88)}}
:root[data-theme="dark"] body.loginbg .pwaslot .pwacard{background:rgba(22,33,37,.88)}
/* daireler */
.dfilter{display:flex;flex-direction:column;gap:10px}
.srch{position:relative}.srch svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.srch .search{padding-left:38px}
.drow{display:flex;gap:8px;align-items:stretch}
.vtog{flex:none} .vtog button{padding:7px 10px;display:flex;align-items:center} .vtog svg{width:17px;height:17px}
.dfilter .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.dfilter .chips::-webkit-scrollbar{display:none}
.dfilter .chip{flex:none}
.bgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:700px){.bgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1200px){.bgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.bcard{padding:14px}
.bhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bhead .grow{flex:1;min-width:0} .bhead b{font-size:15px} .bhead .sub{font-size:12px}
.doors{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.door{position:relative;border:0;border-radius:9px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font:inherit;min-width:0}
.door b{font-family:var(--f-display);font-size:17px;line-height:1.1}
.door span{font-size:10.5px;opacity:.85;white-space:nowrap}
.door i{position:absolute;top:2px;right:3px;font-style:normal;font-size:8px;font-weight:700;opacity:.7}
.door.good{background:var(--good-bg);color:var(--good)} .door.warn{background:var(--warn-bg);color:var(--warn)} .door.bad{background:var(--bad-bg);color:var(--bad)}
.door:hover{outline:2px solid currentColor;outline-offset:-2px} .door:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dots.mini{display:inline-flex;gap:2px;vertical-align:middle}
.dots.mini span{width:6px;height:6px}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.wa:hover{background:#178a45} .btn.wa.icon{padding:6px 8px}
.dfilter .ozseg button{white-space:nowrap;font-size:13px}
.dfilter .ozseg small{font-weight:500;opacity:.7;margin-left:2px}
.unithead a{color:var(--accent);text-decoration:none}
/* ---- menü renkleri ---- */
body{--nav-bg:#16323b;--nav-bg2:#1d4450;--nav-ink:#ffffff;--nav-muted:rgba(255,255,255,.66);--nav-act:rgba(255,255,255,.14);--nav-acc:#7fd3db;--nav-line:rgba(255,255,255,.08)}
body[data-menu="lacivert"]{--nav-bg:#1b2540;--nav-bg2:#26355c;--nav-acc:#9db8ff}
body[data-menu="zeytin"]{--nav-bg:#2f3a2a;--nav-bg2:#45553c;--nav-acc:#c9dc9c}
body[data-menu="bordo"]{--nav-bg:#3b1d24;--nav-bg2:#5a2b35;--nav-acc:#f3b3bf}
body[data-menu="acik"]{--nav-bg:var(--surface);--nav-bg2:var(--surface);--nav-ink:var(--ink);--nav-muted:var(--muted);--nav-act:var(--accent-soft);--nav-acc:var(--accent);--nav-line:var(--line)}
.tabs{background:linear-gradient(180deg,var(--nav-bg),var(--nav-bg2))!important;border-color:var(--nav-line)!important}
.tab{color:var(--nav-muted)}
.tab:hover{color:var(--nav-ink)}
.tab[aria-current="true"]{color:var(--nav-acc);background:var(--nav-act)}
.navhead{display:none}
@media (min-width:900px){
  .tabs{padding-top:18px!important}
  .tab[aria-current="true"]{color:var(--nav-ink);background:var(--nav-act);box-shadow:inset 3px 0 0 var(--nav-acc)}
  .navhead{display:flex;align-items:center;gap:10px;padding:4px 8px 22px;margin-bottom:6px;border-bottom:1px solid var(--nav-line);color:var(--nav-ink)}
  .navhead b{display:block;font-family:var(--f-display);font-size:17px;line-height:1.1}
  .navhead small{display:block;font-size:11.5px;color:var(--nav-muted)}
  .navmark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--nav-act);color:var(--nav-acc)}
  .navmark svg{width:20px;height:20px}
  .topbar .brandmark{display:none}
}
.topbar{background:rgba(238,242,241,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.menupick{display:flex;flex-wrap:wrap;gap:8px}
.menupick button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;font-weight:600;cursor:pointer;font-size:14px}
.menupick button i{width:24px;height:24px;border-radius:50%;border:1px solid var(--line)}
.menupick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
/* giriş ekranı tema düğmesi */
.themetog{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:40;display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.themetog svg{width:16px;height:16px}
:root[data-theme="light"] .themetog{background:rgba(255,255,255,.75);color:var(--ink);border-color:rgba(0,0,0,.08)}
body:not(.loginbg) .themetog{display:none}
/* açık giriş ekranı: fotoğraf daha aydınlık */
:root[data-theme="light"] body.loginbg::before{background:linear-gradient(180deg,rgba(235,242,243,.15) 0%,rgba(235,242,243,.25) 50%,rgba(235,242,243,.7) 100%),url(img/site-giris.jpg) center 30%/cover no-repeat}
@media (min-aspect-ratio: 5/4){
  :root[data-theme="light"] body.loginbg::before{background:linear-gradient(180deg,rgba(235,242,243,.25),rgba(235,242,243,.45)),url(img/site-giris-bulanik.jpg) center/cover no-repeat}
  :root[data-theme="light"] body.loginbg::after{background:linear-gradient(180deg,rgba(235,242,243,.35) 0%,rgba(235,242,243,0) 35%,rgba(235,242,243,0) 70%,rgba(235,242,243,.35) 100%),url(img/site-giris-genis.jpg) center bottom/auto 100% no-repeat}
}
/* giriş: geniş ekranlarda manzara fotoğrafı; giriş kutusu solda, denizin üstünde */
@media (min-aspect-ratio: 5/4){
  body.loginbg::before{display:block!important;background:linear-gradient(90deg,rgba(8,22,36,.55) 0%,rgba(8,22,36,.25) 38%,rgba(8,22,36,0) 62%),linear-gradient(180deg,rgba(8,22,36,.25) 0%,rgba(8,22,36,.1) 50%,rgba(8,22,36,.35) 100%),url(img/giris-manzara.jpg) center 55%/cover no-repeat!important}
  :root[data-theme="light"] body.loginbg::before{background:linear-gradient(90deg,rgba(235,242,246,.25) 0%,rgba(235,242,246,0) 40%),url(img/giris-manzara.jpg) center 55%/cover no-repeat!important;filter:none}
  body.loginbg::after{display:none!important}
  body.loginbg .login{margin:9vh auto 0 max(6vw,32px)}
  body.loginbg .pwaslot{margin:14px auto 0 max(6vw,32px)}
  body.loginbg .credit{position:fixed;left:28px;right:auto;bottom:22px;transform:none;margin:0}

body.loginbg .credit img{width:120px;height:auto;filter:drop-shadow(0 1px 6px rgba(0,0,0,.45))}

@media (min-aspect-ratio: 5/4){body.loginbg .credit{bottom:18px}}

const wrap = s => ({ id: s.id, exists: s.exists(), data: () => s.data() });

  get: async () => wrap(await getDoc(r)), set: d => setDoc(r, d), update: d => updateDoc(r, d), delete: () => deleteDoc(r),
  onSnapshot: (n, e) => onSnapshot(r, s => n(wrap(s)), err => e && e(err)) }; }
function mkQuery(col, ws){ const build = () => ws.length ? query(collection(fs, col), ...ws.map(w => where(w[0], w[1], w[2]))) : collection(fs, col);
  return { where: (f, o, v) => mkQuery(col, ws.concat([[f, o, v]])), get: async () => wrapQ(await getDocs(build())),
    onSnapshot: (n, e) => onSnapshot(build(), s => n(wrapQ(s)), err => e && e(err)), doc: id => mkDoc(col + '/' + id) }; }

<script>
(function(){
'use strict';
const AY = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const AYK = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const DEFAULT_CATS = ['Maaş','SGK / Vergi','Elektrik','Su','Doğalgaz','Asansör','Havuz','Temizlik','Bahçe / Peyzaj','Bakım / Onarım','Sigorta','Kırtasiye / Banka Masrafı','Borç Geri Ödemesi','Diğer'];
const TYPE_LABEL = {odeme:'Ödeme', borc:'Borç ekle', indirim:'İndirim'};

const S = {settings:null, units:{}, ledgers:{}, exps:{}, members:{}, notices:[], requests:[], polls:[], year:null, view:'ozet', unit:null,
  blok:'Tümü', status:'Tümü', q:'', got:{s:false,u:false,l:false,e:false}, pendingDelete:null};
let db = null, dl = null, unsubL = null, unsubE = null;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('tr-TR', {maximumFractionDigits:2});
const TL = n => nf.format(Math.round((n||0)*100)/100) + ' TL';
const up = s => String(s||'').toLocaleUpperCase('tr-TR');
const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const fmtDate = iso => iso ? iso.slice(8,10)+'.'+iso.slice(5,7)+'.'+iso.slice(0,4) : 'tarihsiz';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function parseAmount(v){
  v = String(v||'').trim().replace(/\s|TL|₺/gi,'');
  if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(v)) v = v.replace(/\./g,'').replace(',','.');
  else v = v.replace(',','.');
  const n = Number(v); return isFinite(n) ? Math.round(n*100)/100 : NaN;
}
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>{t.hidden = true}, 2600); }

/* ---------- year / settings ---------- */
function years(){ return Object.keys((S.settings && S.settings.years) || {}).map(Number).sort((a,b)=>a-b); }
function yc(y){ const ys = (S.settings && S.settings.years) || {}; if (ys[y]) return ys[y];
  const prev = years().filter(v=>v<y).pop(); return prev ? {aidat: ys[prev].aidat, openCash:0, openBank:0} : {aidat:0, openCash:0, openBank:0}; }
function dueDay(){ return (S.settings && S.settings.dueDay) || 10; }
function cats(){ return (S.settings && S.settings.categories && S.settings.categories.length) ? S.settings.categories : DEFAULT_CATS; }
function monthsDue(y){
  const now = new Date(), dd = dueDay();
  if (now < new Date(y,0,dd)) return 0;
  if (now.getFullYear() > y) return 12;
  return Math.max(0, Math.min(12, now.getMonth()+1 - (now.getDate() < dd ? 1 : 0)));
}
function unitList(){ return Object.values(S.units).filter(u=>u.active!==false).sort((a,b)=> a.kod < b.kod ? -1 : 1); }
function unitName(u){ return u ? (u.oturan || u.malik || '') : ''; }
function items(kod){ const l = S.ledgers[kod]; return (l && Array.isArray(l.items)) ? l.items : []; }

function calc(kod){
  const u = S.units[kod] || {};
  const aidat = (u.aidat != null && u.aidat !== '') ? Number(u.aidat) : Number(yc(S.year).aidat||0);
  let paid = 0, extra = 0;
  for (const it of items(kod)){
    if (it.type === 'odeme') paid += it.amount; else if (it.type === 'borc') extra += it.amount; else if (it.type === 'indirim') extra -= it.amount;
  }
  const md = monthsDue(S.year);
  const annual = aidat*12 + extra, due = aidat*md + extra;
  const overdue = Math.max(0, Math.round((due - paid)*100)/100);
  const net = Math.max(0, paid - extra);
  const ms = [];
  for (let m=0;m<12;m++){
    if (aidat <= 0) ms.push('f');
    else if (net >= (m+1)*aidat - 0.001) ms.push('p');
    else if (net > m*aidat + 0.001) ms.push(m < md ? 'l' : 'k');
    else ms.push(m < md ? 'l' : 'f');
  }
  // partial month that is also late shows as partial-late: mark partial as k when not due, l when due. Keep partial visible:
  for (let m=0;m<12;m++){ if (aidat>0 && net > m*aidat + 0.001 && net < (m+1)*aidat - 0.001) ms[m] = 'k'; }
  const behind = aidat > 0 ? Math.ceil(overdue/aidat - 0.0001) : 0;
  const status = overdue <= 0 ? 'good' : (behind >= 3 ? 'bad' : 'warn');
  return {aidat, paid, extra, annual, due, overdue, remaining: annual - paid, ms, behind, status, md};
}
const STATUS_TXT = {good:'Güncel', warn:'Gecikmede', bad:'Ciddi gecikme'};

function totals(){
  const t = {paid:0, due:0, overdue:0, annual:0, remaining:0, good:0, warn:0, bad:0, n:0, byBlok:{}, monthPaid:Array(12).fill(0),
    nakit:0, havale:0, mahsup:0, belirsiz:0};
  for (const u of unitList()){
    const c = calc(u.kod); t.n++;
    t.paid += c.paid; t.due += Math.max(0,c.due); t.overdue += c.overdue; t.annual += c.annual; t.remaining += Math.max(0,c.remaining); t[c.status]++;
    const b = t.byBlok[u.blok] || (t.byBlok[u.blok] = {n:0, paid:0, overdue:0, due:0, late:0});
    b.n++; b.paid += c.paid; b.overdue += c.overdue; b.due += Math.max(0,c.due); if (c.overdue>0) b.late++;
    c.ms.forEach((s,i)=>{ if (s==='p') t.monthPaid[i]++; });
    for (const it of items(u.kod)) if (it.type==='odeme'){
      if (it.method==='Nakit') t.nakit += it.amount; else if (it.method==='Havale') t.havale += it.amount; else if (it.method==='Mahsup') t.mahsup += it.amount; else t.belirsiz += it.amount;
    }
  }
  const ex = expItems();
  t.gider = ex.filter(e=>e.category!=='Borç Geri Ödemesi').reduce((a,e)=>a+e.amount,0);
  const gNakit = ex.filter(e=>e.method==='Nakit').reduce((a,e)=>a+e.amount,0);
  const gHavale = ex.filter(e=>e.method==='Havale').reduce((a,e)=>a+e.amount,0);
  const gMahsup = ex.filter(e=>e.method==='Mahsup').reduce((a,e)=>a+e.amount,0);
  const geri = ex.filter(e=>e.category==='Borç Geri Ödemesi').reduce((a,e)=>a+e.amount,0);
  const y = yc(S.year);
  t.kasa = balanceOf('kasa', ex); t.banka = balanceOf('banka', ex);
  t.kasaHesap = Number(y.openCash||0) + t.nakit - gNakit; t.bankaHesap = Number(y.openBank||0) + t.havale - gHavale;
  t.sakinBorc = gMahsup - t.mahsup - geri;
  return t;
}
function expItems(){ const out = []; for (const d of Object.values(S.exps)) for (const it of (d.items||[])) out.push(Object.assign({docId:d.id}, it)); return out.sort((a,b)=> (b.date||'').localeCompare(a.date||'')); }

/* ---------- rendering ---------- */
function setTabs(){
  const cur = S.view === 'daire' ? 'daireler' : S.view;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.go === cur ? 'true':'false'));
  $('#fab').hidden = !(S.got.u && S.got.s) || S.view === 'ayarlar' || S.view === 'daire' || S.view === 'gelen'; if ($('#fab').hidden) fabOpen(false);
  const bc = inboxCount(), bg = $('#gelenBadge'); if (bg){ bg.hidden = !bc; bg.textContent = bc; }
}
function header(){
  const s = S.settings || {};
  $('#siteName').textContent = s.siteName || 'Ustatahir Konutları';
  const d = new Date();
  $('#todayLine').textContent = d.getDate()+' '+AY[d.getMonth()]+' '+d.getFullYear()+' · aylık aidat '+TL(yc(S.year).aidat);
  const sel = $('#yearSel'); const ys = years();
  const html = ys.map(y=>'<option value="'+y+'"'+(y===S.year?' selected':'')+'>'+y+'</option>').join('');
  if (sel.innerHTML !== html) sel.innerHTML = html;
}
function render(){
  if (MODE !== 'admin') return;
  if (!(S.got.s && S.got.u && S.got.l && S.got.e)) return;
  if (!S.settings){ $('#view').innerHTML = `<section class="card" style="display:flex;flex-direction:column;gap:12px"><h2>Hoş geldin</h2><p style="margin:0">Sistemde henüz veri yok. Sana verdiğim yedek dosyasını (.json) seçerek bütün daireleri, ödemeleri ve giderleri tek seferde aktar.</p><div class="actions"><label class="btn primary" for="restoreFile0" style="cursor:pointer">Yedekten içe aktar</label><input id="restoreFile0" type="file" accept=".json,application/json" hidden><button class="btn" data-act="logout">Çıkış</button></div><div id="restoreBox"></div></section>`; return; }
  header(); setTabs();
  const v = $('#view');
  if (S.view === 'ozet') v.innerHTML = vOzet();
  else if (S.view === 'daireler') { v.innerHTML = vDaireler(); const q = $('#q'); if (q && render._focusQ){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }
  else if (S.view === 'daire') v.innerHTML = vDaire(S.unit);
  else if (S.view === 'giderler') v.innerHTML = vGiderler();
  else if (S.view === 'takip') v.innerHTML = vTakip();
  else if (S.view === 'gelen') { v.innerHTML = vGelen(); if (bankRows.length) drawBank(); }
  else if (S.view === 'ayarlar') v.innerHTML = vAyarlar();
  scheduleSummary(); ensureReceipts();
}

function backupDue(){ const lb = (S.settings || {}).lastBackup; return !lb || Date.now() - lb > 30 * 86400000; }
function vOzet(){
  const t = totals(), md = monthsDue(S.year);
  const rate = t.due > 0 ? Math.min(100, Math.round(t.paid / t.due * 100)) : 100;
  const debtors = unitList().map(u=>({u, c:calc(u.kod)})).filter(x=>x.c.overdue>0).sort((a,b)=>b.c.overdue-a.c.overdue);
  const d0 = new Date();
  const svgI = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  const I = {

function openSheet(html){ const o = $('#overlay'); o.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>'; o.hidden = false; const f = o.querySelector('input:not([type=hidden]),select'); if (f && window.matchMedia('(hover:hover)').matches) f.focus(); }
function closeSheet(){ const o = $('#overlay'); o.hidden = true; o.innerHTML = ''; }

function suggestDesc(kod, amount, type){
  if (type !== 'odeme' || !(amount>0) || !kod) return '';
  const c = calc(kod); if (c.aidat <= 0) return 'AİDAT ÖDEMESİ';
  const net = Math.max(0, c.paid - c.extra);
  if (c.paid < c.extra) return 'EK BORÇ ÖDEMESİ';
  const start = Math.floor(net / c.aidat + 1e-9);
  if (start >= 12) return 'AVANS / FAZLA ÖDEME';
  const end = (net + amount) / c.aidat;
  const last = Math.min(11, Math.ceil(end - 1e-9) - 1);
  const partial = (end % 1 > 1e-6 && end < 12) || (net % c.aidat > 1e-6 && start === last);
  const lbl = start >= last ? AY[start] : AY[start] + '–' + AY[last];
  return up(lbl + ' AYI AİDAT ÖDEMESİ' + (partial ? ' (KISMİ)' : '') + (end > 12 + 1e-6 ? ' + AVANS' : ''));
}

function txForm(opts){
  const it = opts.item || null;
  const f = {type: it ? it.type : (opts.type||'odeme'), unit: opts.unit || '', amount: it ? String(it.amount).replace('.',',') : '', date: it ? (it.date||'') : todayISO(),
    method: it ? (it.method||'') : 'Nakit', desc: it ? (it.desc||'') : '', note: it ? (it.note||'') : ''};
  txForm.state = {f, id: it ? it.id : null, fixedUnit: !!opts.unit};
  drawTx();
}
function drawTx(errMsg){
  const {f, id, fixedUnit} = txForm.state;
  const u = S.units[f.unit]; const c = f.unit ? calc(f.unit) : null;

  const quick = c && f.type==='odeme' ? [[c.aidat,'1 ay'],[c.aidat*2,'2 ay'],[c.aidat*3,'3 ay']].concat(c.overdue>0?[[c.overdue,'Borcun tamamı']]:[]) : [];

      : `<div class="field"><label for="fUnit">Daire</label><select id="fUnit"><option value="">Daire seç…</option>${unitList().map(x=>{const cc=calc(x.kod);return `<option value="${esc(x.kod)}"${x.kod===f.unit?' selected':''}>${esc(x.kod)} · ${esc(unitName(x))||'—'}${cc.overdue>0?' · '+TL(cc.overdue)+' borç':''}</option>`;}).join('')}</select></div>`}
    <div class="field"><label for="fAmount">Tutar (TL)</label><input id="fAmount" inputmode="decimal" autocomplete="off" placeholder="1.500" value="${esc(f.amount)}">
      ${quick.length?`<div class="chips">${quick.map(q=>`<button type="button" class="chip" data-f="amount" data-v="${q[0]}">${q[1]} · ${TL(q[0])}</button>`).join('')}</div>`:''}</div>
    <div class="row2">
      <div class="field"><label for="fDate">Tarih</label><input id="fDate" type="date" value="${esc(f.date)}"></div>
      ${f.type==='odeme'?`<div class="field"><label>Ödeme şekli</label><div class="chips">${['Nakit','Havale','Mahsup'].map(m=>`<button type="button" class="chip" data-f="method" data-v="${m}" aria-pressed="${f.method===m}">${m}</button>`).join('')}</div></div>`:'<div></div>'}
    </div>
    <div class="field"><label for="fDesc">Açıklama${f.type!=='odeme'?' (zorunlu)':''}</label><input id="fDesc" value="${esc(f.desc)}" placeholder="${esc(sug || (f.type==='borc'?'ör. ASANSÖR MASRAF PAYI':f.type==='indirim'?'ör. HATALI KAYIT DÜZELTMESİ':''))}">
      <span class="hint" id="sugHint">${sug && !f.desc ? 'Boş bırakırsan "'+esc(sug)+'" yazılır.' : ''}</span></div>
    <div class="field"><label for="fNote">Not (isteğe bağlı)</label><input id="fNote" value="${esc(f.note)}" placeholder="ör. babama teslim edildi"></div>

function readTxFields(){
  const f = txForm.state.f;
  const g = id => { const el = document.getElementById(id); return el ? el.value : null; };
  if (g('fUnit') !== null) f.unit = g('fUnit');
  f.amount = g('fAmount'); f.date = g('fDate'); f.desc = g('fDesc'); f.note = g('fNote');
}
async function saveTx(){
  readTxFields();
  const {f, id} = txForm.state; const amt = parseAmount(f.amount);
  if (!f.unit) return drawTx('Daire seç.');
  if (!(amt > 0)) return drawTx('Tutarı sıfırdan büyük bir sayı olarak yaz (ör. 1500).');
  if (f.type !== 'odeme' && !f.desc.trim()) return drawTx('Borç ekleme ve indirimde açıklama yazmak gerekiyor; ileride neden eklendiği anlaşılsın.');
  const desc = f.desc.trim() ? up(f.desc.trim()) : suggestDesc(f.unit, amt, f.type);
  const rec = {id: id || uid(), type: f.type, amount: amt, date: f.date || '', desc, method: f.type==='odeme' ? f.method : '', note: f.note.trim(), at: Date.now()};
  if (!id && f.type === 'odeme') rec.receiptNo = fmtReceipt(maxReceipt() + 1);
  try {
  if (id){
    for (const k of Object.keys(S.ledgers)) if (k !== f.unit && items(k).some(x=>x.id===id)) await writeLedger(k, cur => cur.filter(x=>x.id!==id));
  }
  await writeLedger(f.unit, cur => { const i = cur.findIndex(x=>x.id===rec.id); if (i>=0){ rec.at = cur[i].at || rec.at; if (cur[i].receiptNo && rec.type === 'odeme') rec.receiptNo = cur[i].receiptNo; cur[i] = rec; } else cur.push(rec); return cur; }); closeSheet();
  if (!id && f.type === 'odeme'){ const k = f.unit, rid = rec.id; openSheet(`<h2>Ödeme kaydedildi</h2><p style="margin:0">${esc(k)} · ${TL(amt)} · ${esc(rec.method || '')}<br>Makbuz no: <b>${esc(rec.receiptNo)}</b></p><p class="hint" style="margin:0">Sakin bu makbuzu kendi ekranından da indirebilir.</p><div class="actions" style="justify-content:flex-end"><button class="btn" data-act="close">Kapat</button><button class="btn primary" data-act="rcpt" data-kod="${esc(k)}" data-id="${esc(rid)}">Makbuz (PDF)</button></div>`); }
  else toast(f.type==='odeme' ? 'Ödeme kaydedildi' : 'Kayıt eklendi'); }
  catch(e){ drawTx(saveErr(e)); }
}
function saveErr(e){ const c = e && e.code; if (c==='permission-denied') return 'Bu işlem için yetkin yok. Yönetici hesabıyla girdiğinden ve güvenlik kurallarının yüklendiğinden emin ol.'; if (c==='quota_exceeded') return 'Veritabanı doldu. Eski yıllardan bir yedek alıp bana haber ver.'; if (c==='invalid_argument') return 'Bu kayıt yazılamadı. Programı sahibi olarak açtığından emin ol.'; return 'Kaydedilemedi, bağlantını kontrol edip tekrar dene.'; }
async function writeLedger(kod, change){
  const ref = db.doc('ledger/' + S.year + '_' + kod);
  const snap = await ref.get(); const cur = snap.exists ? ((snap.data().items) || []).slice() : [];
  const list = typeof change === 'function' ? change(cur) : change;
  if (snap.exists) await ref.update({items: list}); else await ref.set({year: S.year, unit: kod, items: list});
}

async function saveExp(){
  const st = expForm.state; const amt = parseAmount(document.getElementById('eAmount').value);
  const date = document.getElementById('eDate').value; const item = document.getElementById('eItem').value.trim();
  const err = m => { document.getElementById('eErr').innerHTML = '<div class="err">'+esc(m)+'</div>'; };
  if (!item) return err('Giderin ne için olduğunu yaz.');
  if (!(amt>0)) return err('Tutarı sıfırdan büyük bir sayı olarak yaz.');
  if (!date) return err('Tarih seç.');
  if (Number(date.slice(0,4)) !== S.year) return err('Tarih '+S.year+' yılı içinde olmalı. Başka bir yılın gideri için üstten yılı değiştir.');
  const rec = {id: st.id || uid(), date, item, category: document.getElementById('eCat').value, amount: amt, method: st.method, note: document.getElementById('eNote').value.trim(), at: Date.now()};
  const docId = date.slice(0,7);
  try {
    if (st.docId && st.docId !== docId){ const old = S.exps[st.docId]; await db.doc('exp/'+st.docId).update({items: (old.items||[]).filter(x=>x.id!==st.id)}); }
    const cur = S.exps[docId]; let list = cur ? (cur.items||[]).slice() : [];
    const i = list.findIndex(x=>x.id===rec.id); if (i>=0) list[i] = rec; else list.push(rec);
    if (cur) await db.doc('exp/'+docId).update({items: list}); else await db.doc('exp/'+docId).set({year: S.year, month: docId, items: list});
    closeSheet(); toast('Gider kaydedildi');
  } catch(e){ err(saveErr(e)); }
}

function remindText(kod){

/* ---------- gecikme tazminatı ---------- */
function feeRate(){ const r = S.settings && S.settings.feeRate; return (r === 0 || r) ? Number(r) : 5; }
function lateFee(kod){
  const c = calc(kod), rate = feeRate(); if (!(rate > 0) || c.aidat <= 0) return 0;
  let lastUntil = null;
  for (const it of items(kod)) if (it.kind === 'tazminat' && it.until && (!lastUntil || it.until > lastUntil)) lastUntil = it.until;
  const lu = lastUntil ? new Date(lastUntil + 'T00:00:00') : null;
  const now = new Date(); now.setHours(0,0,0,0);
  const net = Math.max(0, c.paid - c.extra);
  let fee = 0;
  for (let m = 0; m < c.md; m++){
    const unpaid = Math.min(c.aidat, Math.max(0, (m+1)*c.aidat - net));
    if (unpaid <= 0) continue;
    let start = new Date(S.year, m, dueDay()); if (lu && lu > start) start = lu;
    const days = Math.floor((now - start) / 86400000);
    if (days > 0) fee += unpaid * rate / 100 * days / 30;
  }
  return Math.round(fee * 100) / 100;
}
async function addFee(kod){
  const fee = lateFee(kod); if (!(fee > 0)) return;
  const it = {id: uid(), type:'borc', kind:'tazminat', until: todayISO(), amount: fee, date: todayISO(),
    desc: 'GECİKME TAZMİNATI (KMK 20, AYLIK %' + feeRate() + ') ' + fmtDate(todayISO()) + ' TARİHİNE KADAR', method:'', note:'', at: Date.now()};
  try { await writeLedger(kod, cur => cur.concat([it])); toast('Gecikme tazminatı borca eklendi'); } catch(e){ toast(saveErr(e)); }
}

/* ---------- takip (kademeli) ---------- */
const STAGES = ['1. hatırlatma','2. hatırlatma','Yazılı ihtar','Avukata verildi','Taksit anlaşması','Ödendi / kapandı','Not'];
function lateInfo(kod){
  const c = calc(kod); if (c.overdue <= 0 || c.aidat <= 0) return {days:0, step:null, c};
  const net = Math.max(0, c.paid - c.extra);
  const first = Math.min(11, Math.floor(net / c.aidat + 1e-9));
  const now = new Date(); now.setHours(0,0,0,0);
  const days = Math.max(0, Math.floor((now - new Date(S.year, first, dueDay())) / 86400000));
  let step = 0; if (days >= 180) step = 3; else if (days >= 90) step = 2; else if (days >= 30) step = 1; else step = 0;
  if (days < 5) step = null;
  return {days, step, c};
}
const STEP_TXT = ['1. hatırlatma','2. hatırlatma + tazminat bildirimi','Yazılı ihtar','Avukat / icra takibi'];
const STEP_CLS = ['warn','warn','bad','bad'];

  let d = String(tel || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('00')) d = d.slice(2);
  if (d.length === 11 && d.startsWith('0')) d = '9' + d;
  else if (d.length === 10 && d.startsWith('5')) d = '90' + d;
  return d.length >= 11 ? d : '';
}

  if (step === 2) return `İHTARNAME\n\nİhtar eden: ${site} Yönetimi\nMuhatap: ${u.malik || niceName(u)}${u.oturan && u.malik ? ' (oturan: ' + u.oturan + ')' : ''}\nBağımsız bölüm: ${u.blok} Blok, Daire ${u.no}\n\n${d} tarihi itibarıyla ${S.year} yılına ait ${TL(c.overdue)} tutarında aidat borcunuz ödenmemiştir. Kat Mülkiyeti Kanunu'nun 20. maddesi uyarınca geciken her ay için %${feeRate()} gecikme tazminatı işlemekte olup bugüne kadar işleyen tazminat ${TL(fee)}'dir.\n\nİşbu ihtarnamenin tebliğinden itibaren 15 gün içinde toplam borcun ödenmesini, aksi halde yasal yollara (icra takibi) başvurulacağını ve doğacak masrafların tarafınıza yükleneceğini ihtar ederiz.${iban}\n\n${site} Yönetimi`;

/* ---------- PDF yardımcıları ---------- */
async function htmlToPdfBlob(html){
  const box = document.getElementById('ekstre-render'); box.innerHTML = html;
  try {
    const canvas = await window.html2canvas(box.firstElementChild, {scale:2, backgroundColor:'#ffffff'});
    const pdf = new window.jspdf.jsPDF({unit:'pt', format:'a4'});
    const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
    const pagePx = Math.floor(canvas.width * ph / pw);
    for (let y = 0, p = 0; y < canvas.height; y += pagePx, p++){
      const h = Math.min(pagePx, canvas.height - y);
      const slice = document.createElement('canvas'); slice.width = canvas.width; slice.height = h;
      const ctx = slice.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,slice.width,h); ctx.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
      if (p) pdf.addPage();
      pdf.addImage(slice.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, pw, h * pw / canvas.width);
    }
    return pdf.output('blob');
  } finally { box.innerHTML = ''; }
}

/* ---------- sayıyı yazıya çevir ---------- */
function yaziyla(n){
  const B = ['', 'Bir', 'İki', 'Üç', 'Dört', 'Beş', 'Altı', 'Yedi', 'Sekiz', 'Dokuz'];
  const O = ['', 'On', 'Yirmi', 'Otuz', 'Kırk', 'Elli', 'Altmış', 'Yetmiş', 'Seksen', 'Doksan'];
  const uc = x => { const y = Math.floor(x/100), o = Math.floor(x%100/10), b = x%10; const p = [];
    if (y) p.push((y > 1 ? B[y] + ' ' : '') + 'Yüz'); if (o) p.push(O[o]); if (b) p.push(B[b]); return p.join(' '); };
  const lira = Math.floor(n), kurus = Math.round((n - lira) * 100);
  const parts = []; let rest = lira;
  [[1e9,'Milyar'],[1e6,'Milyon'],[1e3,'Bin']].forEach(([v, w]) => { const g = Math.floor(rest / v); rest %= v; if (g) parts.push(g === 1 && w === 'Bin' ? 'Bin' : uc(g) + ' ' + w); });
  if (rest) parts.push(uc(rest));
  let s = (parts.join(' ') || 'Sıfır') + ' Türk Lirası';
  if (kurus) s += ' ' + uc(kurus) + ' Kuruş';
  return s;
}

/* ---------- makbuz ---------- */
function maxReceipt(){
  let m = 0; const pre = S.year + '-';
  for (const l of Object.values(S.ledgers)) for (const it of (l.items || [])) if (it.receiptNo && String(it.receiptNo).startsWith(pre)) m = Math.max(m, Number(String(it.receiptNo).slice(pre.length)) || 0);
  return m;
}
const fmtReceipt = n => S.year + '-' + String(n).padStart(4, '0');
let receiptsChecked = false, rcTimer = null, rcBusy = false;
function ensureReceipts(){ if (rcTimer) return; rcTimer = setTimeout(() => { rcTimer = null; runReceipts(); }, 3000); }
async function runReceipts(){
  if (rcBusy || MODE !== 'admin' || !S.settings || S.year !== (S.settings.currentYear || S.year)) return;
  const miss = [];
  for (const [kod, l] of Object.entries(S.ledgers)) for (const it of (l.items || [])) if (it.type === 'odeme' && !it.receiptNo) miss.push({kod, id: it.id, date: it.date || '9999', at: it.at || 0});
  if (!miss.length) return;
  rcBusy = true;
  try {
    miss.sort((a, b) => a.date.localeCompare(b.date) || a.at - b.at);
    let n = maxReceipt(); const byUnit = {};
    miss.forEach(m => { (byUnit[m.kod] = byUnit[m.kod] || {})[m.id] = fmtReceipt(++n); });
    for (const [kod, map] of Object.entries(byUnit)){
      try { await writeLedger(kod, cur => cur.map(it => map[it.id] && !it.receiptNo ? Object.assign({}, it, {receiptNo: map[it.id]}) : it)); } catch(e){}
    }
  } finally { rcBusy = false; }
}

/* ---------- bina silueti ---------- */
function skylineSvg(opts){
  opts = opts || {}; const colors = opts.colors || {}, hl = opts.highlight;
  const blocks = [['A1',5],['A2',5],['B1',4],['B2',4],['C1',5],['C2',5]];
  const W = 84, G = 16, base = 128, floorH = 19;
  let x = 10, out = '';
  blocks.forEach(([b, floors]) => {
    const h = floors * floorH + 14, y = base - h;
    const light = opts.tone === 'light';
    const fill = colors[b] || (hl === b ? (light ? '#6cc6cf' : 'var(--accent)') : (light ? 'rgba(255,255,255,.14)' : 'var(--sky-block)'));
    const win = (hl === b || colors[b]) ? 'rgba(255,255,255,.8)' : (light ? 'rgba(255,255,255,.45)' : 'var(--sky-win)');
    out += `<g><rect x="${x}" y="${y}" width="${W}" height="${h}" rx="4" fill="${fill}"/><rect x="${x+W/2-9}" y="${base-16}" width="18" height="16" rx="2" fill="${win}" opacity=".55"/>`;
    for (let f = 0; f < floors; f++) for (let c = 0; c < 2; c++) out += `<rect x="${x + 14 + c*36}" y="${y + 10 + f*floorH}" width="20" height="10" rx="2" fill="${win}"/>`;
    out += `<text x="${x+W/2}" y="${base+16}" text-anchor="middle" font-size="12" font-weight="700" fill="${opts.label || (opts.tone === 'light' ? 'rgba(255,255,255,.75)' : 'var(--muted)')}" font-family="inherit">${b}</text></g>`;
    x += W + G;
  });
  return `<svg class="skyline" viewBox="0 0 ${x} ${base+22}" role="img" aria-label="Site blokları"><rect x="0" y="${base}" width="${x}" height="2" fill="${opts.ground || (opts.tone === 'light' ? 'rgba(255,255,255,.3)' : 'var(--line)')}"/>${out}</svg>`;
}
function blokColors(){
  const t = totals(), c = {};
  for (const [b, x] of Object.entries(t.byBlok)){ const r = x.due > 0 ? x.paid / x.due : 1; c[b] = r >= .95 ? 'var(--good)' : r >= .75 ? 'var(--warn)' : 'var(--bad)'; }
  return c;
}

  return d;
}

let bankRows = [];
function parseBankDate(v){
  if (v == null || v === '') return '';
  if (typeof v === 'number'){ const d = new Date(Math.round((v - 25569) * 86400000)); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  const s = String(v).trim(); let m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})/); if (m) return m[3] + '-' + pad(m[2]) + '-' + pad(m[1]);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[1] + '-' + m[2] + '-' + m[3];
  return '';
}
function parseBankAmount(v){
  if (typeof v === 'number') return v;
  let s = String(v || '').replace(/\s|TL|TRY|₺/gi, ''); const neg = /^-/.test(s) || /^\(.*\)$/.test(s); s = s.replace(/[-()+]/g, '');
  const n = parseAmount(s); return isNaN(n) ? NaN : (neg ? -n : n);
}
function matchUnit(desc){
  const d = up(desc).replace(/[İI]/g, 'I');
  const m = d.match(/\b([ABC])\s*-?\s*([12])\s*(?:BLOK|BL\.?)?\s*[-/ ]?\s*(?:D(?:AIRE|\.)?\s*(?:NO)?\s*[:.]?\s*)?0?(\d{1,2})\b/);
  if (m){ const kod = m[1] + m[2] + '-' + pad(Number(m[3])); if (S.units[kod]) return {kod, by: 'kod'}; }
  for (const u of unitList()) for (const nm of [u.oturan, u.malik]){ if (nm && nm.length >= 5 && nm !== 'RSU' && d.includes(up(nm).replace(/[İI]/g, 'I').replace(/\s*(BEY|HANIM)$/, ''))) return {kod: u.kod, by: 'isim'}; }
  return null;
}
function onBankFile(file){
  if (!window.XLSX){ toast('Excel aracı yüklenemedi, sayfayı yenile.'); return; }
  const r = new FileReader();
  r.onload = () => {
    try {
      const wb = window.XLSX.read(new Uint8Array(r.result), {type: 'array'}); const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = window.XLSX.utils.sheet_to_json(ws, {header: 1, raw: true, defval: ''});
      let h = -1, cD = -1, cT = -1, cA = -1, cAl = -1;
      for (let i = 0; i < Math.min(rows.length, 40); i++){
        const low = rows[i].map(x => String(x).toLocaleLowerCase('tr-TR'));
        const d = low.findIndex(x => x.includes('tarih')), t = low.findIndex(x => x.includes('açıklama') || x.includes('aciklama')), t2 = low.findIndex(x => x.includes('işlem') || x.includes('islem'));
        const a = low.findIndex(x => x.includes('tutar') || x.includes('miktar')), al = low.findIndex(x => x.includes('alacak'));
        if (d >= 0 && (t >= 0 || t2 >= 0) && (a >= 0 || al >= 0)){ h = i; cD = d; cT = t >= 0 ? t : t2; cA = a; cAl = al; break; }
      }
      if (h < 0){ $('#bankBox').innerHTML = '<div class="err">Dosyada "Tarih", "Açıklama" ve "Tutar" (veya "Alacak") sütunlarını bulamadım. Bankanın Excel dökümünü seçtiğinden emin ol; olmuyorsa dosyayı bana gönder, uyarlayayım.</div>'; return; }
      const out = [];
      rows.slice(h + 1).forEach((row, i) => {
        const amt = parseBankAmount(cAl >= 0 ? row[cAl] : row[cA]); const desc = String(row[cT] || '').trim();
        if (!(amt > 0) || !desc) return;
        const date = parseBankDate(row[cD]); const m = matchUnit(desc);
        const dup = m && items(m.kod).some(it => it.type === 'odeme' && Math.abs(it.amount - amt) < .01 && it.date === date);
        out.push({i, date, desc, amount: amt, kod: m ? m.kod : '', by: m ? m.by : '', dup, on: !!m && !dup});
      });
      bankRows = out; drawBank();
    } catch(e){ $('#bankBox').innerHTML = '<div class="err">Dosya okunamadı. Excel (.xlsx/.xls) veya CSV olduğundan emin ol.</div>'; }
  };
  r.readAsArrayBuffer(file);
}
function drawBank(){

  box.innerHTML = `<div class="notice">${bankRows.length} gelen havale bulundu · ${bankRows.filter(r => r.kod).length} tanesi bir daireyle eşleşti · ${bankRows.filter(r => r.dup).length} tanesi zaten kayıtlı görünüyor.</div>

}
async function saveBank(){
  const sel = bankRows.filter(r => r.on && r.kod); if (!sel.length) return;
  let n = maxReceipt(), done = 0; const byUnit = {};
  sel.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  for (const r of sel){ (byUnit[r.kod] = byUnit[r.kod] || []).push(r); }
  try {
    for (const [kod, list] of Object.entries(byUnit)){
      await writeLedger(kod, cur => { let paidSoFar = 0; return cur.concat(list.map(r => { const rec = {id: uid(), type: 'odeme', amount: r.amount, date: r.date, desc: suggestDesc(kod, r.amount, 'odeme'), method: 'Havale', note: 'Banka: ' + r.desc.slice(0, 60), at: Date.now() + (done++), receiptNo: fmtReceipt(++n)}; paidSoFar += r.amount; return rec; })); });
    }

  } catch(e){ toast(saveErr(e)); }
}

async function createAccount(kod, n){
  const used = new Set(Object.values(S.members||{}).map(m=>m.username));
  let username = kod, i = 1;
  while (used.has(username)) { i++; username = kod + '-' + i; }
  const pass = genPass();
  for (let tries = 0; tries < 5; tries++){
    try {
      const uidNew = await FB.createResident(emailFor(username), pass);
      await db.doc('members/' + uidNew).set({unit: kod, username, initialPassword: pass, pwChanged: false, active: true, createdAt: Date.now()});
      return {username, pass};
    } catch(e){
      if (e && e.code === 'auth/email-already-in-use'){ i++; username = kod + '-' + i; continue; }
      throw e;
    }
  }
  throw new Error('Kullanıcı adı bulunamadı');
}

async function startResident(user){

  const units = md ? ((md.units && md.units.length) ? md.units : (md.unit ? [md.unit] : [])) : [];
  if (!md || md.active === false || !units.length){
    $('#view').innerHTML = '<section class="card login"><div class="rnote err">Bu hesap artık kullanılmıyor ya da bir daireye bağlı değil. Güncel giriş bilgileriniz için site yönetimine başvurun.</div><button class="btn" data-act="logout">Çıkış</button></section>'; return; }
  R = {units, cur: units[0], member: md, docs: {}, summary: null, nmap: {}, qmap: {}, notices: [], requests: [], polls: [], votes: {}, voteSubs: new Set()};
  S.units = {}; S.ledgers = {}; S.settings = null;
  let t = null;
  const draw = () => { clearTimeout(t); t = setTimeout(() => {
    if (!S.settings || !S.units[R.cur]) return;
    S.year = S.settings.currentYear || new Date().getFullYear();
    S.ledgers = {}; for (const k of R.units){ const l = (R.docs[k] || []).find(d => d.year === S.year); if (l) S.ledgers[k] = l; }
    R.notices = [].concat(...Object.values(R.nmap)); R.requests = [].concat(...Object.values(R.qmap));
    const y = window.scrollY; $('#view').innerHTML = residentPage(R.cur, false); window.scrollTo(0, y);
  }, 30); };
  R.draw = draw;
  const fail = () => { $('#view').innerHTML = '<section class="card login"><div class="rnote err">Bilgileriniz okunamadı. Sayfayı yenileyip tekrar deneyin.</div><button class="btn" data-act="logout">Çıkış</button></section>'; };
  subs.push(db.doc('members/' + user.uid).onSnapshot(x => { R.member = x.exists ? x.data() : R.member; draw(); }, ()=>{}));
  subs.push(db.doc('settings/main').onSnapshot(x => { S.settings = x.exists ? x.data() : {}; draw(); }, fail));
  subs.push(db.doc('summary/current').onSnapshot(x => { R.summary = x.exists ? x.data() : null; draw(); }, ()=>{}));
  for (const k of units){
    subs.push(db.doc('units/' + k).onSnapshot(x => { if (x.exists) S.units[k] = Object.assign({kod: k}, x.data()); draw(); }, fail));
    subs.push(db.collection('ledger').where('unit','==',k).onSnapshot(q => { R.docs[k] = q.docs.map(d => Object.assign({id: d.id}, d.data())); draw(); }, fail));
    subs.push(db.collection('notices').where('unit','==',k).onSnapshot(q => { R.nmap[k] = q.docs.map(d => Object.assign({id: d.id}, d.data())); draw(); }, ()=>{}));
    subs.push(db.collection('requests').where('unit','==',k).onSnapshot(q => { R.qmap[k] = q.docs.map(d => Object.assign({id: d.id}, d.data())); draw(); }, ()=>{}));
  }
  subs.push(db.collection('polls').onSnapshot(q => {
    R.polls = q.docs.map(d => Object.assign({id: d.id}, d.data()));
    for (const p of R.polls) for (const k of units){ const key = p.id + '_' + k; if (R.voteSubs.has(key)) continue; R.voteSubs.add(key);
      subs.push(db.doc('polls/' + p.id + '/votes/' + k).onSnapshot(x => { R.votes[key] = x.exists ? x.data() : null; draw(); }, ()=>{})); }
    draw();
  }, ()=>{}));
}

const CMP = {year: null, state: 'idle', data: null};
function cmpCutoff(y){
  // Bu yıl için bugüne kadar, geçmiş bir yıl görüntüleniyorsa yılın tamamı
  const now = new Date();
  if (S.year < now.getFullYear()) return {md: '12-31', full: true};
  const p = n => String(n).padStart(2, '0');
  return {md: p(now.getMonth() + 1) + '-' + p(now.getDate()), full: false};
}
function cmpFigures(year, ledgers, exps, md){
  const lim = year + '-' + md; const inRange = d => !d || d <= lim;
  let tahsil = 0, tahsilAll = 0, units = 0, payers = 0;
  for (const l of ledgers){
    if (S.units[l.unit] && S.units[l.unit].active === false) continue;
    units++; let any = false;
    for (const it of (l.items || [])) if (it.type === 'odeme'){ tahsilAll += it.amount; if (inRange(it.date)){ tahsil += it.amount; any = true; } }
    if (any) payers++;
  }
  const cat = {}; let gider = 0, giderAll = 0;
  for (const d of exps) for (const it of (d.items || [])){
    if (it.category === 'Borç Geri Ödemesi') continue;
    giderAll += it.amount;
    if (inRange(it.date)){ gider += it.amount; cat[it.category || 'Diğer'] = (cat[it.category || 'Diğer'] || 0) + it.amount; }
  }
  return {tahsil, tahsilAll, gider, giderAll, cat, units, payers, aidat: Number(yc(year).aidat || 0)};
}
async function cmpLoad(){
  const py = S.year - 1; CMP.year = S.year; CMP.state = 'loading'; render();
  try {
    const [lq, eq] = await Promise.all([db.collection('ledger').where('year', '==', py).get(), db.collection('exp').where('year', '==', py).get()]);
    CMP.data = {ledgers: lq.docs.map(d => d.data()), exps: eq.docs.map(d => d.data())};
    CMP.state = 'ok';
  } catch(e){ CMP.state = 'err'; }
  if (CMP.year === S.year) render();
}

  const cats = Array.from(new Set(Object.keys(A.cat).concat(Object.keys(B.cat)))).sort((x, y) => (B.cat[y] || 0) + (A.cat[y] || 0) - (B.cat[x] || 0) - (A.cat[x] || 0));
  const max = Math.max(1, ...cats.map(c => Math.max(A.cat[c] || 0, B.cat[c] || 0)));
  const dayTxt = cut.full ? 'yılın tamamı' : `1 Ocak – ${Number(cut.md.slice(3))} ${AY[Number(cut.md.slice(0, 2)) - 1]} arası`;

      ${row('Toplanan aidat', A.tahsil, B.tahsil)}
      ${row('Yapılan gider', A.gider, B.gider)}
      ${row('Gelir − gider', A.tahsil - A.gider, B.tahsil - B.gider, {noPct: true, fmt: v => `<span style="color:var(--${v < 0 ? 'bad' : 'good'})">${TL(Math.round(v))}</span>`})}
