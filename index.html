    </tbody></table></div>
    ${!cut.full ? `<p class="sub" style="margin:0">${py} yılının tamamında ${TL(A.tahsilAll)} toplandı, ${TL(A.giderAll)} harcandı.</p>` : ''}
    ${cats.length ? `<h3 style="margin:6px 0 0;font-size:15px">Gider kalemleri</h3>
    <div class="cmpleg"><span><i style="background:var(--muted)"></i>${py}</span><span><i style="background:var(--accent)"></i>${S.year}</span></div>
    <div class="cmpbars">${cats.map(c => `<div class="cmprow"><div class="cmplbl"><span>${esc(c)}</span>${pct(A.cat[c] || 0, B.cat[c] || 0)}</div>
      <div class="cmpbar"><b style="width:${(A.cat[c] || 0) / max * 100}%;background:var(--muted)"></b><span class="num">${TL(A.cat[c] || 0)}</span></div>
      <div class="cmpbar"><b style="width:${(B.cat[c] || 0) / max * 100}%;background:var(--accent)"></b><span class="num">${TL(B.cat[c] || 0)}</span></div></div>`).join('')}</div>` : ''}
    <div class="actions"><button class="btn small" data-act="cmpLoad">Yenile</button></div>
  </section>`;
}


/* ---------- tema: uygulama hep açık, giriş ekranı koyu/açık seçilebilir ---------- */
const MENU_THEMES = [['petrol','Petrol','#16323b'],['lacivert','Lacivert','#1b2540'],['zeytin','Zeytin','#2f3a2a'],['bordo','Bordo','#3b1d24'],['acik','Açık','#ffffff']];
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : v; } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
function loginTheme(){ const v = lsGet('ustatahir-giris-tema', ''); return v === 'dark' || v === 'light' ? v : (matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
function applyTheme(){
  const html = document.documentElement;
  const t = MODE === 'login' ? loginTheme() : 'light';
  html.dataset.theme = t;
  document.body.dataset.menu = lsGet('ustatahir-menu', 'petrol');
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', MODE === 'login' ? (t === 'dark' ? '#10242b' : '#dfe8ea') : '#f4f7f6');
}
function themeCard(){
  const cur = lsGet('ustatahir-menu', 'petrol');
  return `<section class="card" style="display:flex;flex-direction:column;gap:12px">
    <h2>Görünüm</h2>
    <p style="margin:0">Menünün rengini seç. Seçim bu cihazda saklanır. Giriş ekranının koyu ya da açık olmasını giriş ekranının sağ üstündeki düğmeyle değiştirebilirsin.</p>
    <div class="menupick">${MENU_THEMES.map(([k,l,c])=>`<button data-act="menuTheme" data-v="${k}" aria-pressed="${cur===k}"><i style="background:${c}"></i>${l}</button>`).join('')}</div>
  </section>`;
}

/* ---------- kasa / banka sayımı ----------
   Sayım "o günün sonunda elimde şu kadar para vardı" demektir. Bakiye = son sayım + sayım tarihinden SONRAKİ hareketler.
   Böylece geçmişe dönük girilen kayıtlar (sayım tarihinden önceki) güncel bakiyeyi bozmaz. */
function counts(acc, y){ const c = (yc(y == null ? S.year : y).counts || []).filter(x => !acc || x.acc === acc); return c.slice().sort((a,b) => (a.date||'').localeCompare(b.date||'') || (a.at||0) - (b.at||0)); }
function lastCount(acc){ const c = counts(acc); return c.length ? c[c.length - 1] : null; }
function flowsOf(acc, ex){
  const m = acc === 'kasa' ? 'Nakit' : 'Havale', out = [];
  for (const u of unitList()) for (const it of items(u.kod)) if (it.type === 'odeme' && it.method === m) out.push({date: it.date || '', amt: it.amount});
  for (const e of (ex || expItems())) if (e.method === m) out.push({date: e.date || '', amt: -e.amount});
  return out;
}
function balanceOf(acc, ex, upTo){
  const y = yc(S.year), lc = counts(acc).filter(c => !upTo || c.date <= upTo).pop();
  const fl = flowsOf(acc, ex).filter(f => !upTo || (f.date && f.date <= upTo));
  if (!lc) return Number((acc === 'kasa' ? y.openCash : y.openBank) || 0) + fl.reduce((a, f) => a + f.amt, 0);
  return Number(lc.actual) + fl.filter(f => f.date && f.date > lc.date).reduce((a, f) => a + f.amt, 0);
}
function countCard(){
  const t = totals(), all = counts().slice().reverse(), lk = lastCount('kasa'), lb = lastCount('banka');
  const pend = S.pendingDelete && S.pendingDelete.type === 'count' ? S.pendingDelete.id : null;
  const row = (lbl, v, lc) => `<div class="cnt-box"><span class="l">${lbl}</span><b class="num" style="${v < 0 ? 'color:var(--bad)' : ''}">${TL(v)}</b><span class="s">${lc ? 'son sayım ' + fmtDate(lc.date) : 'henüz sayım yok'}</span></div>`;
  return `<section class="card" id="countCard" style="display:flex;flex-direction:column;gap:12px">
    <h2>Kasa ve banka sayımı</h2>
    <p style="margin:0">Elindeki gerçek parayı yaz; sistemin hesapladığı bakiye o tutara eşitlenir. Sayım tarihinden önceki kayıtları sonradan girsen de bakiye değişmez, sadece o tarihten sonraki ödeme ve giderler eklenip çıkar.</p>
    <div class="cnt-grid">${row('Kasa (nakit)', t.kasa, lk)}${row('Banka', t.banka, lb)}</div>
    <div class="row2">
      <div class="field"><label for="cntCash">Elimdeki nakit (TL)</label><input id="cntCash" inputmode="decimal" placeholder="boş bırakılırsa değişmez"></div>
      <div class="field"><label for="cntBank">Bankadaki para (TL)</label><input id="cntBank" inputmode="decimal" placeholder="boş bırakılırsa değişmez"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="cntDate">Sayım tarihi</label><input id="cntDate" type="date" value="${S.year === new Date().getFullYear() ? todayISO() : S.year + '-12-31'}" min="${S.year}-01-01" max="${S.year}-12-31"></div>
      <div class="field"><label for="cntNote">Not (isteğe bağlı)</label><input id="cntNote" placeholder="ör. kasa sayıldı, banka ekstresine göre"></div>
    </div>
    <p class="hint" style="margin:0">Sayım günü dahil, o güne kadar tarihli bütün hareketler sayımın içinde kabul edilir. Banka tutarını banka uygulamasındaki bakiyeden yaz.</p>
    <div class="actions"><button class="btn primary" data-act="saveCount">Sayımı kaydet</button></div>
    ${all.length ? `<h3 style="font-size:15px;margin:4px 0 0">Sayım geçmişi</h3><div class="list">${all.map(c => { const d = Number(c.diff || 0); return `<div class="row"><span class="pill ${c.acc === 'kasa' ? 'mute' : 'good'}" style="min-width:58px;justify-content:center">${c.acc === 'kasa' ? 'Kasa' : 'Banka'}</span>
      <div class="grow"><div class="t num">${TL(c.actual)}</div><div class="s">${fmtDate(c.date)} · fark ${d === 0 ? 'yok' : '<span style="color:var(--' + (d > 0 ? 'good' : 'bad') + ')">' + (d > 0 ? '+' : '') + TL(d) + '</span>'}${c.note ? ' · ' + esc(c.note) : ''}</div></div>
      <button class="iconbtn rm ${pend === c.id ? 'confirm' : ''}" data-act="delCount" data-id="${esc(c.id)}">${pend === c.id ? 'Emin misin? Sil' : 'Sil'}</button></div>`; }).join('')}</div>` : ''}
  </section>`;
}
async function saveCount(){
  const date = $('#cntDate').value, note = $('#cntNote').value.trim();
  const vc = $('#cntCash').value.trim(), vb = $('#cntBank').value.trim();
  if (!vc && !vb){ toast('Nakit ya da banka tutarından en az birini yaz.'); return; }
  if (!date || date.slice(0,4) !== String(S.year)){ toast(S.year + ' yılı içinde bir sayım tarihi seç.'); return; }
  const ex = expItems(), add = [], msgs = [];
  for (const [acc, v] of [['kasa', vc], ['banka', vb]]) { if (!v) continue;
    const a = parseAmount(v); if (isNaN(a)) { toast((acc === 'kasa' ? 'Nakit' : 'Banka') + ' tutarı okunamadı.'); return; }
    const before = Math.round(balanceOf(acc, ex, date) * 100) / 100, diff = Math.round((a - before) * 100) / 100;
    add.push({id: uid(), acc, date, actual: a, before, diff, note, at: Date.now()});
    msgs.push((acc === 'kasa' ? 'Kasa' : 'Banka') + (diff === 0 ? ' tutuyor' : ' farkı ' + (diff > 0 ? '+' : '') + TL(diff)));
  }
  const ys = Object.assign({}, S.settings.years); const cur = Object.assign({}, yc(S.year)); cur.counts = (cur.counts || []).concat(add); ys[S.year] = cur;
  try { await db.doc('settings/main').update({years: ys}); toast('Sayım kaydedildi · ' + msgs.join(' · ')); } catch(e){ toast(saveErr(e)); }
}
async function delCount(id){
  if (!(S.pendingDelete && S.pendingDelete.type === 'count' && S.pendingDelete.id === id)) { S.pendingDelete = {type: 'count', id}; render(); return; }
  S.pendingDelete = null;
  const ys = Object.assign({}, S.settings.years); const cur = Object.assign({}, yc(S.year)); cur.counts = (cur.counts || []).filter(c => c.id !== id); ys[S.year] = cur;
  try { await db.doc('settings/main').update({years: ys}); toast('Sayım silindi'); } catch(e){ toast(saveErr(e)); }
}
/* ---------- data ---------- */
function setYear(y){
  if (S.year === y && unsubL) return;
  S.year = y; S.got.l = false; S.got.e = false; S.ledgers = {}; S.exps = {};
  if (unsubL) unsubL(); if (unsubE) unsubE();
  unsubL = db.collection('ledger').where('year','==',y).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d=>{ const x = d.data(); m[x.unit] = Object.assign({id:d.id}, x); }); S.ledgers = m; S.got.l = true; render();
  }, onErr);
  unsubE = db.collection('exp').where('year','==',y).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d=>{ m[d.id] = Object.assign({id:d.id}, d.data()); }); S.exps = m; S.got.e = true; render();
  }, onErr);
  render();
}
function onErr(e){ const c = e && e.code; $('#view').innerHTML = '<div class="card empty">Veriler okunamadı' + (c === 'permission-denied' ? ': bu hesabın yetkisi yok. Güvenlik kurallarının yüklendiğinden emin ol.' : '. Sayfayı yenileyip tekrar dene.') + ' <button class="btn small" data-act="logout">Çıkış</button></div>'; }

async function boot(){
  try { FB = await Promise.race([window.__fbReady, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), 15000))]); }
  catch(e){ $('#view').innerHTML = '<div class="card empty">Sistem yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.</div>'; return; }
  db = FB.db;
  dl = { save: async ({filename, data}) => { const blob = data instanceof Blob ? data : new Blob([data]); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000); return {status:'saved'}; } };
  FB.onAuth(user => {
    cleanupSubs(); closeSheet();
    if (!user) return showLogin();
    if (ADMIN_EMAILS.includes((user.email || '').toLowerCase())) return startAdmin();
    return startResident(user);
  });
}
boot();
})();
